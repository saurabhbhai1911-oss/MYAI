<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>MYAI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0f14;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

/* Header */
header {
    flex: 0 0 auto;
    height: 60px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: #111821;
    border-bottom: 1px solid #27313d;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.new-chat {
    border: none;
    background: #202b38;
    color: white;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 13px;
}

/* Main chat area */
#chatBox {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 15px 12px 20px;
    -webkit-overflow-scrolling: touch;
}

.welcome {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #aeb8c4;
    font-size: 17px;
    padding: 20px;
}

.message {
    width: 100%;
    margin: 10px 0;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.bubble {
    max-width: 88%;
    padding: 11px 13px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 15px;
    word-wrap: break-word;
    white-space: pre-wrap;
}

.user .bubble {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.ai .bubble {
    background: #18212b;
    color: #f1f5f9;
    border-bottom-left-radius: 4px;
}

.listen-btn {
    display: block;
    margin-top: 7px;
    border: none;
    background: #273443;
    color: white;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 12px;
}

/* Typing */
.typing {
    color: #9ca8b5;
    font-size: 13px;
    padding: 5px 3px;
}

/* Bottom input area */
.input-area {
    flex: 0 0 auto;
    width: 100%;
    background: #111821;
    border-top: 1px solid #27313d;
    padding: 8px 9px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

.input-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
}

#userInput {
    flex: 1;
    min-width: 0;
    height: 45px;
    border: 1px solid #303c49;
    outline: none;
    border-radius: 12px;
    background: #18212b;
    color: white;
    padding: 0 12px;
    font-size: 15px;
}

#userInput::placeholder {
    color: #7f8b98;
}

.action-btn {
    flex: 0 0 auto;
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 11px;
    color: white;
    font-size: 19px;
    background: #253140;
}

#sendButton {
    background: #2563eb;
}

#micButton.listening {
    background: #dc2626;
}

/* Status */
#status {
    text-align: center;
    min-height: 17px;
    margin-top: 4px;
    color: #7f8b98;
    font-size: 11px;
}

/* Small screens */
@media (max-width: 380px) {
    header {
        height: 56px;
        min-height: 56px;
    }

    .logo {
        font-size: 19px;
    }

    .bubble {
        max-width: 92%;
        font-size: 14px;
    }

    #userInput {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🤖 MYAI</div>
    <button class="new-chat" id="newChatButton">＋ New Chat</button>
</header>

<main id="chatBox">
    <div class="welcome" id="welcome">
        <div>
            <div style="font-size:30px;margin-bottom:10px;">🤖</div>
            <div>Hi! I'm MYAI.</div>
            <div style="font-size:13px;margin-top:7px;">
                Ask me anything...
            </div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-row">

        <button
            class="action-btn"
            id="micButton"
            type="button"
            aria-label="Microphone">
            🎤
        </button>

        <input
            id="userInput"
            type="text"
            placeholder="Message MYAI..."
            autocomplete="off"
            autocorrect="on"
            spellcheck="true">

        <button
            class="action-btn"
            id="sendButton"
            type="button"
            aria-label="Send">
            ➤
        </button>

    </div>

    <div id="status"></div>
</div>

<script>
const userId = localStorage.getItem("myai_user_id") || crypto.randomUUID();
localStorage.setItem("myai_user_id", userId);
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const newChatButton = document.getElementById("newChatButton");
const statusText = document.getElementById("status");
const welcome = document.getElementById("welcome");

let recognition = null;
let isListening = false;
let isSending = false;

/* -------------------------
   ADD MESSAGE
------------------------- */

function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);
    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;

    return bubble;
}

/* -------------------------
   AI MESSAGE + LISTEN
------------------------- */

function addAIMessage(text) {

    const bubble = addMessage(text, "ai");

    const listenButton = document.createElement("button");
    listenButton.className = "listen-btn";
    listenButton.textContent = "🔊 Listen";

    listenButton.addEventListener("click", function() {
        speakText(text);
    });

    bubble.appendChild(document.createElement("br"));
    bubble.appendChild(listenButton);
}

/* -------------------------
   SPEECH
------------------------- */

function speakText(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}

/* -------------------------
   SEND MESSAGE
------------------------- */

async function sendMessage() {

    if (isSending) return;

    const message = userInput.value.trim();

    if (!message) return;

    isSending = true;
    sendButton.disabled = true;

    addMessage(message, "user");

    /*
       IMPORTANT:
       Remove focus from input immediately.
       This prevents Android keyboard from
       automatically reopening after AI reply.
    */
    userInput.blur();

    userInput.value = "";

    statusText.textContent = "MYAI is typing...";

    const typingMessage = document.createElement("div");
    typingMessage.className = "message ai";
    typingMessage.id = "typingMessage";

    const typingBubble = document.createElement("div");
    typingBubble.className = "bubble typing";
    typingBubble.textContent = "Typing...";

    typingMessage.appendChild(typingBubble);
    chatBox.appendChild(typingMessage);

    chatBox.scrollTop = chatBox.scrollHeight;

    try {
              
           const response = await fetch("/chat", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
        "x-user-id": userId
    },
    body: JSON.stringify({
        message: message
    })
});
        const data = await response.json();

        const oldTyping = document.getElementById("typingMessage");

        if (oldTyping) {
            oldTyping.remove();
        }

        if (!response.ok) {

            addAIMessage(
                data.error ||
                data.message ||
                "Sorry, something went wrong."
            );

        } else {

            const reply =
                data.reply ||
                data.message ||
                "I couldn't generate a reply.";

            addAIMessage(reply);
        }

    } catch (error) {

        const oldTyping = document.getElementById("typingMessage");

        if (oldTyping) {
            oldTyping.remove();
        }

        addAIMessage(
            "Network Error: Please check your connection or server."
        );

    } finally {

        statusText.textContent = "";

        isSending = false;
        sendButton.disabled = false;

        /*
           IMPORTANT:
           Do NOT use userInput.focus() here.
           That was causing the keyboard to open again.
        */
        userInput.blur();

        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

/* -------------------------
   SEND BUTTON
------------------------- */

sendButton.addEventListener("click", function() {
    sendMessage();
});

/* -------------------------
   ENTER KEY
------------------------- */

userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }
});

/* -------------------------
   NEW CHAT
------------------------- */

newChatButton.addEventListener("click", function() {

    window.speechSynthesis?.cancel();

    chatBox.innerHTML = `
        <div class="welcome" id="welcome">
            <div>
                <div style="font-size:30px;margin-bottom:10px;">🤖</div>
                <div>Hi! I'm MYAI.</div>
                <div style="font-size:13px;margin-top:7px;">
                    Ask me anything...
                </div>
            </div>
        </div>
    `;

    userInput.value = "";

    /*
       Make sure keyboard does not open
       after New Chat.
    */
    userInput.blur();

    statusText.textContent = "";
});

/* -------------------------
   SPEECH RECOGNITION
------------------------- */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {

        isListening = true;

        micButton.classList.add("listening");
        micButton.textContent = "⏹️";

        statusText.textContent = "Listening...";
    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        userInput.value = transcript;

        statusText.textContent = "";
    };

    recognition.onerror = function() {

        statusText.textContent =
            "Microphone error";

        isListening = false;

        micButton.classList.remove("listening");
        micButton.textContent = "🎤";
    };

    recognition.onend = function() {

        isListening = false;

        micButton.classList.remove("listening");
        micButton.textContent = "🎤";

        statusText.textContent = "";
    };

    micButton.addEventListener("click", function() {

        if (isListening) {

            recognition.stop();

        } else {

            try {
                recognition.start();
            } catch (error) {
                console.log(error);
            }
        }
    });

} else {

    micButton.addEventListener("click", function() {

        statusText.textContent =
            "Speech recognition is not supported in this browser.";

    });
}
</script>

</body>
</html>
