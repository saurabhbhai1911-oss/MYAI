<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYAI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    height: 60px;
    background: #111827;
    border-bottom: 1px solid #263244;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.new-chat {
    border: none;
    background: #2563eb;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

/* Chat */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
}

.message {
    max-width: 85%;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #1e293b;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

.welcome {
    text-align: center;
    margin-top: 25vh;
    color: #cbd5e1;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

/* Input area */
.input-area {
    padding: 10px;
    background: #111827;
    border-top: 1px solid #263244;
}

.input-box {
    display: flex;
    gap: 8px;
    max-width: 900px;
    margin: auto;
}

#userInput {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #334155;
    border-radius: 12px;
    background: #0f172a;
    color: white;
    outline: none;
    font-size: 16px;
}

#userInput:focus {
    border-color: #2563eb;
}

button {
    font-size: 18px;
}

.icon-btn {
    width: 48px;
    border: none;
    border-radius: 12px;
    background: #334155;
    color: white;
    cursor: pointer;
}

.send-btn {
    width: 55px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.icon-btn:hover,
.send-btn:hover,
.new-chat:hover {
    opacity: 0.85;
}

.speak-btn {
    margin-top: 7px;
    border: none;
    background: transparent;
    color: #94a3b8;
    cursor: pointer;
    font-size: 14px;
}

.status {
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    padding-top: 5px;
}

/* Mobile */
@media (max-width: 600px) {
    .header {
        height: 55px;
    }

    .logo {
        font-size: 20px;
    }

    .chat-box {
        padding: 12px;
    }

    .message {
        max-width: 92%;
    }

    .welcome h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🤖 MYAI</div>
        <button class="new-chat" id="newChat">🆕 New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="welcome" id="welcome">
            <h1>MYAI</h1>
            <p>How can I help you today?</p>
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <button
                class="icon-btn"
                id="micButton"
                title="Voice Input">
                🎤
            </button>

            <input
                id="userInput"
                type="text"
                placeholder="Message MYAI..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendButton"
                title="Send">
                ➤
            </button>

        </div>

        <div class="status" id="status">
            MYAI is ready
        </div>

    </div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const newChat = document.getElementById("newChat");
const welcome = document.getElementById("welcome");
const statusText = document.getElementById("status");

let recognition = null;
let isListening = false;

/* Add message */
function addMessage(text, type) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const content = document.createElement("div");
    content.textContent = text;

    message.appendChild(content);

    if (type === "ai") {

        const speakButton = document.createElement("button");

        speakButton.className = "speak-btn";
        speakButton.textContent = "🔊 Listen";

        speakButton.onclick = () => {
            speakText(text);
        };

        message.appendChild(speakButton);
    }

    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;
}

/* Speak */
function speakText(text) {

    if (!("speechSynthesis" in window)) {
        alert("Text to speech is not supported in this browser.");
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    speechSynthesis.speak(speech);
}

/* Send message */
async function sendMessage() {

    const message = userInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    userInput.value = "";

    statusText.textContent = "MYAI is thinking...";

    sendButton.disabled = true;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Server error"
            );
        }

        addMessage(
            data.reply || "No response received.",
            "ai"
        );

        statusText.textContent = "MYAI is ready";

    } catch (error) {

        console.error(error);

        addMessage(
            "❌ Network Error: " + error.message,
            "ai"
        );

        statusText.textContent = "Connection error";

    } finally {

        sendButton.disabled = false;

        userInput.focus();
    }
}

/* Send button */
sendButton.addEventListener(
    "click",
    sendMessage
);

/* Enter key */
userInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }

    }
);

/* New chat */
newChat.addEventListener(
    "click",
    function() {

        chatBox.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>MYAI</h1>
                <p>How can I help you today?</p>
            </div>
        `;

        userInput.value = "";

        statusText.textContent =
            "New chat started";

        userInput.focus();

    }
);

/* Voice recognition */
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onstart = function() {

        isListening = true;

        micButton.textContent = "🔴";

        statusText.textContent =
            "Listening...";

    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        userInput.value = transcript;

        statusText.textContent =
            "Voice received";

    };

    recognition.onerror = function(event) {

        console.log(
            "Speech error:",
            event.error
        );

        statusText.textContent =
            "Mic error";

    };

    recognition.onend = function() {

        isListening = false;

        micButton.textContent = "🎤";

        if (
            statusText.textContent ===
            "Listening..."
        ) {
            statusText.textContent =
                "MYAI is ready";
        }

    };

    micButton.addEventListener(
        "click",
        function() {

            if (isListening) {

                recognition.stop();

            } else {

                recognition.start();

            }

        }
    );

} else {

    micButton.addEventListener(
        "click",
        function() {

            alert(
                "Voice recognition is not supported in this browser."
            );

        }
    );

}

userInput.focus();

</script>

</body>
</html>
