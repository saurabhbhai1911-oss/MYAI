<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAI</title>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  background: #1f2937;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  border-bottom: 1px solid #374151;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

button {
  border: none;
  cursor: pointer;
  color: white;
}

#newChat {
  background: #374151;
  padding: 10px 14px;
  border-radius: 8px;
}

#newChat:active {
  background: #4b5563;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 85%;
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.ai {
  background: #374151;
  margin-right: auto;
}

#welcome {
  text-align: center;
  margin-top: 30vh;
  color: #9ca3af;
}

.input-area {
  padding: 10px;
  background: #1f2937;
  border-top: 1px solid #374151;
  display: flex;
  gap: 8px;
  align-items: center;
}

#message {
  flex: 1;
  resize: none;
  min-height: 45px;
  max-height: 120px;
  padding: 12px;
  border: none;
  outline: none;
  border-radius: 10px;
  background: #374151;
  color: white;
  font-size: 16px;
}

#message::placeholder {
  color: #9ca3af;
}

#mic,
#send {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  font-size: 20px;
}
